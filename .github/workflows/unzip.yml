name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q AinTradutor.zip
          rsync -a --exclude .github AinTradutor/ ./
          rm -rf AinTradutor AinTradutor.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extrai projeto"
          git push
